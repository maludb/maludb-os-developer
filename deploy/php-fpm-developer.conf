; Developer's PHP-FPM pool (design §6.1, D6, K54). NOTHING HERE HAS BEEN RUN — the owner runs it: deploy/ROOT_STEPS.sh step 2 renders
; {{APP_DIR}} and installs this file as /etc/php/8.3/fpm/pool.d/developer.conf, then restarts php8.3-fpm.
;
; WHY A POOL OF ITS OWN: under mod_php every application's PHP runs as the web server's user. The door (services/door/) checks its peer's
; uid, so Developer's PHP must run under a uid no other application shares — developer-web, in the group `developer` (which also holds
; developer-mcp; config/.env is root:developer 0640 and the door's socket is developer-door:developer 0660). Apache (www-data) reaches
; the pool through its socket only.
;
; The connection budget (design §6.1): each child holds at most one connection to the tool's own database; the door holds its own pool.

[developer]
user = developer-web
group = developer

listen = /run/php/developer.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 30s
pm.max_requests = 500
; a workbench script or a rehearsal may run 300 s (design §6.1); PHP releases its session before asking the door
request_terminate_timeout = 330s

chdir = {{APP_DIR}}
clear_env = yes
security.limit_extensions = .php

php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 72M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 320
php_admin_flag[expose_php] = off
php_admin_flag[allow_url_fopen] = off
; its own session files, written by developer-web 0600 — no other application's PHP can read a Developer session
php_admin_value[session.save_path] = /var/lib/php/sessions-developer
php_admin_value[session.gc_probability] = 1
php_admin_value[session.gc_divisor] = 100
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.cookie_samesite] = Lax
php_admin_value[session.use_strict_mode] = 1
; no shell from a web request (design §0.5): proc_open stays — the diagram writer starts Graphviz's `dot` with an argument array
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,popen,pcntl_exec
