# Developer — an application from us beside the Business OS kernel. NOTHING HERE HAS BEEN RUN — the owner runs it: rendered and
# installed by the kernel's installer (bin/app_install.php: {{APP_FQDN}} = developer.<domain>, {{APP_DIR}} = /srv/apps/developer, the
# ports from config/.env) after deploy/ROOT_STEPS.sh steps 0–3 (the modules proxy_fcgi, setenvif, rewrite, proxy, proxy_http and
# headers; php8.3-fpm and the pool `developer`).
#
# Developer's PHP runs in ITS OWN PHP-FPM POOL as the system user developer-web (design §6.1, D6, K54), not in mod_php as www-data:
# the door (services/door/) admits only developer-web and developer-mcp, so a peer check means "this application", never "any
# application on the host". mod_php keeps serving every other vhost; the <FilesMatch> below, merged after the server-wide one, hands
# THIS vhost's .php to the pool's socket. Check after install: `apachectl -S` lists the site, `curl -s 127.0.0.1:{{APP_INTERNAL_PORT}}/api/v1/health`
# answers, and `ps -o user= -p $(pgrep -f 'php-fpm: pool developer' | head -1)` says developer-web.
#
# No php_admin_value lines here: they configure mod_php only. The pool's limits are in /etc/php/8.3/fpm/pool.d/developer.conf
# (deploy/php-fpm-developer.conf).
#
# The public allow-list under /api: /api/v1/health only (design §4, §14). The two read MCP servers under the application's name, for the
# kernel's run tokens and the kernel's token (personal MCP tokens are off — design §4). storage/ is never under the web root.

<VirtualHost *:80>
	ServerName {{APP_FQDN}}
	DocumentRoot {{APP_DIR}}/html
	ErrorLog ${APACHE_LOG_DIR}/developer-error.log
	CustomLog ${APACHE_LOG_DIR}/developer-access.log combined
	SetEnvIf X-Forwarded-Proto "https" HTTPS=on
	# A CSV into a workbench (64 MB) is the largest request.
	LimitRequestBody 75497472
	# A workbench script or a rehearsal runs up to 300 s (design §6.1); the pool's request_terminate_timeout is 330 s.
	ProxyTimeout 330

	<IfModule mod_headers.c>
		Header always set X-Content-Type-Options "nosniff"
		Header always set X-Frame-Options "DENY"
		Header always set Referrer-Policy "no-referrer"
		Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
		# Design §8 (S8): scripts only from the application's own committed bundles — the CodeMirror and PEV2 islands included — with no
		# inline script and no eval (PEV2's bundle must be built against Vue's runtime-only build with precompiled templates);
		# style attributes are allowed (Bootstrap components set them); no frames, no foreign origin for anything.
		Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
	</IfModule>

	<FilesMatch "\.php$">
		SetHandler "proxy:unix:/run/php/developer.sock|fcgi://developer-fpm/"
	</FilesMatch>

	<Directory {{APP_DIR}}/html>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	# The two read MCP servers, under the application's name. Host is NOT preserved (the SDK's DNS-rebinding guard checks it against
	# loopback). Bearer auth is the servers' own: the tenant's run token for a hired agent, or the kernel's token for app_roles.
	ProxyPreserveHost Off
	ProxyPass        /mcp/records  http://127.0.0.1:{{MCP_RECORDS_PORT}}/mcp
	ProxyPassReverse /mcp/records  http://127.0.0.1:{{MCP_RECORDS_PORT}}/mcp
	ProxyPass        /mcp/activity http://127.0.0.1:{{MCP_ACTIVITY_PORT}}/mcp
	ProxyPassReverse /mcp/activity http://127.0.0.1:{{MCP_ACTIVITY_PORT}}/mcp

	RewriteEngine On
	RewriteRule ^/mcp/(records|activity)(/|$) - [L]

	# /api: the health check and nothing else (no keys, no K7 shares in version 1 — design §4).
	RewriteRule ^/api/v1/health/?$ /api/v1/health.php [L,QSA]
	RewriteRule ^/api/ - [R=404,L]

	# The sign-on receivers (the kernel's hand-off; no login form of our own).
	RewriteRule ^/sso$ /sso.php [L,QSA]
	RewriteRule ^/sso/logout$ /sso/logout.php [L,QSA]

	# Canonical URLs (the action manifest, Phase 1): /x/{id}/verb -> /x/verb.php?id=, /x/new -> form.php, /x/{id}/edit -> form.php?id=,
	# /x/{id} -> view.php?id=. Database and object routes (/db/{datname}/…, design §9) are added by Phase 1's manifest.
	RewriteCond %{DOCUMENT_ROOT}/$1/$3.php -f
	RewriteRule ^/(.+)/([0-9]+)/([a-z_-]+)$ /$1/$3.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/new$ /$1/form.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/([0-9]+)/edit$ /$1/form.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/view.php -f
	RewriteRule ^/(.+)/([0-9]+)$ /$1/view.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1.php -f
	RewriteRule ^/(.+?)/?$ /$1.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/index.php -f
	RewriteRule ^/(.+[^/])$ /$1/index.php [L,QSA]
</VirtualHost>

# PHP on the internal port, for the kernel's actions server (the agents' four free actions) and approval replays only — the same pool.
Listen 127.0.0.1:{{APP_INTERNAL_PORT}}
<VirtualHost 127.0.0.1:{{APP_INTERNAL_PORT}}>
	DocumentRoot {{APP_DIR}}/html
	ErrorLog ${APACHE_LOG_DIR}/developer-error.log
	CustomLog ${APACHE_LOG_DIR}/developer-access.log combined
	LimitRequestBody 75497472
	ProxyTimeout 330
	<IfModule mod_headers.c>
		Header always set X-Content-Type-Options "nosniff"
	</IfModule>
	<FilesMatch "\.php$">
		SetHandler "proxy:unix:/run/php/developer.sock|fcgi://developer-fpm/"
	</FilesMatch>
	<Directory {{APP_DIR}}/html>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>
	RewriteEngine On
	RewriteRule ^/api/v1/health/?$ /api/v1/health.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/$3.php -f
	RewriteRule ^/(.+)/([0-9]+)/([a-z_-]+)$ /$1/$3.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/new$ /$1/form.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/([0-9]+)/edit$ /$1/form.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/view.php -f
	RewriteRule ^/(.+)/([0-9]+)$ /$1/view.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1.php -f
	RewriteRule ^/(.+?)/?$ /$1.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/index.php -f
	RewriteRule ^/(.+[^/])$ /$1/index.php [L,QSA]
</VirtualHost>
