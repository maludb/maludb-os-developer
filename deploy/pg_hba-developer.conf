# BEGIN maludb-os-developer
# NOTHING HERE HAS BEEN RUN — the owner runs it: deploy/ROOT_STEPS.sh step 5 puts this block FIRST in PostgreSQL's pg_hba.conf (between
# these markers, replacing an earlier copy) and reloads the server. Design §6.1: the tool's database roles reach PostgreSQL over loopback
# only, with SCRAM — from anywhere else they are refused before any later, broader line can admit them, so a password that leaks (or
# that a workbench's role changes for itself) reaches nothing from outside this host. The door and the grants service connect to
# 127.0.0.1 with passfiles; the peer socket is not used by these roles.
# PostgreSQL 16+: an entry in the user column starting with "/" is a regular expression — the per-workbench and per-rehearsal login
# roles dxw_<n> and dxr_<n> made by developer_rolemaker.
host    all   developer_meta,developer_read,developer_read_masked,developer_write,developer_ops,developer_rolemaker,developer_memory,developer_grantor,/^dx[wr]_[0-9]+$   127.0.0.1/32   scram-sha-256
host    all   developer_meta,developer_read,developer_read_masked,developer_write,developer_ops,developer_rolemaker,developer_memory,developer_grantor,/^dx[wr]_[0-9]+$   ::1/128        scram-sha-256
host    all   developer_meta,developer_read,developer_read_masked,developer_write,developer_ops,developer_rolemaker,developer_memory,developer_grantor,/^dx[wr]_[0-9]+$   all            reject
local   all   developer_meta,developer_read,developer_read_masked,developer_write,developer_ops,developer_rolemaker,developer_memory,developer_grantor,/^dx[wr]_[0-9]+$                  reject
# END maludb-os-developer
